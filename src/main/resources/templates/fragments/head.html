
<head th:fragment="head(title)">

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <title th:text="${title}">Online Store</title>

    <!-- PWA / Installazione applicazione -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Online Store">
    <link rel="apple-touch-icon" th:href="@{/icons/apple-touch-icon.png}">

    <!-- Bootstrap CSS -->
	  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

	<!-- Google Fonts: Inter + Playfair Display -->
	  <link rel="preconnect" href="https://fonts.googleapis.com">
	  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
	  
	  <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet"/>

    
	
		  <!-- CSS progetto -->
		       
	<link rel="stylesheet" th:href="@{/css/navbar.css(v='20260718-site-notice-v1')}"/>
	<link rel="stylesheet" th:href="@{/css/style.css(v='20260716-2')}">
	<link rel="stylesheet" th:href="@{/css/home.css}">
	<link rel="stylesheet" th:href="@{/css/shop.css}">

    <!-- PWA disattivata: script solo per rimuovere vecchi service worker/cache -->
    <script th:src="@{/js/pwa.js(v='20260608-1')}" defer></script>

<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<script>
(function () {
    const originalFetch = window.fetch;
    window.fetch = function (input, init) {
        const url = new URL(input instanceof Request ? input.url : String(input), location.href);
        const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
        if (url.origin === location.origin && !['GET', 'HEAD', 'OPTIONS'].includes(method)) {
            init = Object.assign({}, init);
            const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
            const token = document.querySelector('meta[name="_csrf"]');
            const header = document.querySelector('meta[name="_csrf_header"]');
            if (token && header) headers.set(header.content, token.content);
            init.headers = headers;
        }
        return originalFetch.call(this, input, init);
    };
    document.addEventListener('DOMContentLoaded', function () {
        if (window.jQuery) window.jQuery.ajaxPrefilter(function (options, original, xhr) {
            if (new URL(options.url, location.href).origin === location.origin && !/^(GET|HEAD|OPTIONS)$/i.test(options.type)) {
                const token = document.querySelector('meta[name="_csrf"]');
                const header = document.querySelector('meta[name="_csrf_header"]');
                if (token && header) xhr.setRequestHeader(header.content, token.content);
            }
        });
    });
})();
</script>
</head>
