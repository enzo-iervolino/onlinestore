<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="forgotPasswordModal">
    <style>
        #forgotPasswordModal {
            width: min(500px, calc(100% - 2rem));
            max-height: calc(100dvh - 2rem);
            margin: auto;
            padding: 0;
            border: 0;
            border-radius: 0.5rem;
            background: #fff;
            color: #212529;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
        }

        #forgotPasswordModal::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        #forgotPasswordModal .modal-header {
            justify-content: space-between;
            padding: 0.85rem 0.75rem;
            background: #a34a66;
            color: #fff;
        }

        #forgotPasswordModal .modal-body {
            padding: 1rem 0.75rem 0.75rem;
        }

        #forgotPasswordModal #forgot-email {
            border: 1px solid #8a929c;
            border-radius: 0.75rem;
            background: #fff;
            color: #212529;
        }

        #forgotPasswordModal #forgot-email::placeholder {
            color: #656d77;
            opacity: 1;
        }

        #forgotPasswordModal #forgot-email:focus {
            border-color: #8c3e59;
            outline: 2px solid #8c3e59;
            outline-offset: 2px;
        }
    </style>

    <dialog id="forgotPasswordModal" aria-labelledby="forgotPasswordTitle"
            th:attr="data-home-url=@{/}">
        <header class="modal-header">
            <h2 id="forgotPasswordTitle" class="modal-title h5">Recupero password</h2>
            <button type="button" id="forgot-password-close"
                    class="btn-close" aria-label="Chiudi"></button>
        </header>

        <div class="modal-body">
            <p id="forgotSentAlert" class="alert alert-success" role="status"
               th:if="${forgotSent == true}">
                Email recupero inviata
            </p>
            <p id="forgotEmailError" class="alert alert-danger" role="alert"
               th:if="${forgotError != null}" th:text="${forgotError}"></p>
            <form th:action="@{/password/forgot}" method="post"
                  th:unless="${forgotSent == true}">
                <input type="hidden" name="fromModal" value="true">
                <p class="text-muted mb-3">
                    Inserisci la tua email. Se è registrata, riceverai un link per reimpostare la password.
                </p>
                <div class="mb-3">
                    <label for="forgot-email" class="form-label">Email</label>
                    <input type="email" id="forgot-email" name="email" class="form-control"
                           placeholder="nome@email.it" autocomplete="email" th:value="${forgotEmail}"
                           th:attr="aria-invalid=${forgotError != null},aria-describedby=${forgotError != null ? 'forgotEmailError' : null}"
                           required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Invia link di recupero</button>
            </form>
        </div>
    </dialog>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dialog = document.getElementById('forgotPasswordModal');
            if (typeof dialog.showModal !== 'function') {
                return;
            }

            document.querySelectorAll('[data-open-password-recovery]').forEach(function (link) {
                link.addEventListener('click', function (event) {
                    if (event.defaultPrevented || event.button !== 0 ||
                        event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) {
                        return;
                    }
                    dialog.showModal();
                    event.preventDefault();
                });
            });

            document.getElementById('forgot-password-close').addEventListener('click', function () {
                dialog.close();
            });

            if (document.getElementById('forgotSentAlert')) {
                dialog.showModal();
                setTimeout(() => window.location.replace(dialog.dataset.homeUrl), 30000);
            } else if (document.getElementById('forgotEmailError')) {
                dialog.showModal();
            }
        });
    </script>
</th:block>
</body>
</html>
