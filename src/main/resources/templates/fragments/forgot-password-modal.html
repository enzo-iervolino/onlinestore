<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body th:fragment="forgotPasswordModal">

<div class="modal fade"
     id="forgotPasswordModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    Recupero password
                </h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>

            <div class="modal-body">

                <!-- ALERT (nascosto di default) -->
                <div id="forgotSentAlert"
                     class="alert alert-success text-center small d-none">
                    📧 Email inviata!  
                    Se l’indirizzo è registrato, riceverai a breve il link per il reset.
                </div>

                <p class="text-muted mb-3">
                    Inserisci la tua email.
                    Se è registrata, riceverai un link per reimpostare la password.
                </p>

                <form th:action="@{/password/forgot}" method="post">

                    <!-- CSRF -->
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="forgot-email" class="form-label">
                            Email
                        </label>
                        <input type="email"
                               id="forgot-email"
                               name="email"
                               class="form-control"
                               placeholder="nome@email.it"
                               required>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Invia link di recupero
                    </button>

                </form>

            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const params = new URLSearchParams(window.location.search);
        const forgotSent = params.get('forgotSent');

        if (forgotSent === 'true') {

            const modalEl = document.getElementById('forgotPasswordModal');
            const alertBox = document.getElementById('forgotSentAlert');

            if (modalEl && alertBox) {

                // mostra modale
                const modal = new bootstrap.Modal(modalEl);
                modal.show();

                // mostra alert
                alertBox.classList.remove('d-none');

                // auto-chiusura
                setTimeout(() => {
                    modal.hide();
                },  6000);
            }
        }
    });
</script>

</body>
</html>
