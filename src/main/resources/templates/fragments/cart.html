<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="cartOffcanvas">

    <style>
        #cartOffcanvas {
            width: 400px !important;
        }

        :root {
            --nav-height: 53px;
        }

        #cartCanvas {
            top: var(--nav-height);
            height: calc(100vh - var(--nav-height));
        }

        #cartCanvas.offcanvas {
            bottom: auto;
        }

        #cartCanvas.offcanvas-end {
            width: 200px;
        }

        @media (max-width: 576px) {
            #cartOffcanvas {
                width: 100% !important;
            }

            #cartCanvas.offcanvas-end {
                width: 100%;
            }
        }

        #cartOffcanvas .offcanvas-body {
            overflow-x: hidden;
        }

        #cartOffcanvas .cart-offcanvas-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        #cartOffcanvas .cart-offcanvas-item {
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 18px;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.035);
        }

        #cartOffcanvas .cart-offcanvas-main {
            display: grid;
            grid-template-columns: 74px minmax(0, 1fr);
            gap: 0.85rem;
            align-items: start;
        }

        #cartOffcanvas .cart-offcanvas-media-box {
            width: 74px;
            min-width: 74px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.45rem;
        }

        #cartOffcanvas .cart-item-media {
            width: 74px;
            height: 92px;
            object-fit: cover;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 3px;
            display: block;
        }

        #cartOffcanvas video.cart-item-media {
            object-fit: cover;
        }

        #cartOffcanvas .cart-item-placeholder {
            width: 74px;
            height: 92px;
            border-radius: 12px;
            background: rgba(108, 117, 125, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cartOffcanvas .cart-offcanvas-info {
            min-width: 0;
        }

        #cartOffcanvas .cart-item-name {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.22;
            color: #ffffff;
            margin-bottom: 0.35rem;
            white-space: normal;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        #cartOffcanvas .cart-item-meta {
            font-size: 0.74rem;
            line-height: 1.25;
            color: rgba(255, 255, 255, 0.68);
            margin-bottom: 0.35rem;
            word-break: break-word;
        }

        #cartOffcanvas .cart-item-variant-code {
            display: inline-block;
            font-size: 0.68rem;
            line-height: 1.15;
            color: rgba(255, 255, 255, 0.66);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: top;
        }

        #cartOffcanvas .cart-item-colorSize {
            font-size: 0.78rem;
            line-height: 1.25;
            color: rgba(255, 255, 255, 0.78);
            margin-bottom: 0.35rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #cartOffcanvas .cart-item-price {
            font-size: 0.82rem;
            line-height: 1.25;
            color: rgba(255, 255, 255, 0.84);
            margin-bottom: 0.5rem;
        }

        #cartOffcanvas .cart-offcanvas-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        #cartOffcanvas .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        #cartOffcanvas .cart-qty-group {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 9px;
            overflow: hidden;
            height: 30px;
            background: rgba(0, 0, 0, 0.14);
        }

        #cartOffcanvas .cart-qty-btn,
        #cartOffcanvas .cart-qty-value {
            width: 30px;
            height: 30px;
            min-width: 30px;
            border: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.35);
            background: transparent;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            font-size: 0.85rem;
        }

        #cartOffcanvas .cart-qty-btn:last-child,
        #cartOffcanvas .cart-qty-value:last-child {
            border-right: 0;
        }

        #cartOffcanvas .cart-qty-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        #cartOffcanvas .cart-qty-value {
            font-weight: 700;
            cursor: default;
        }

        #cartOffcanvas .cart-remove-btn {
            font-size: 0.78rem;
            line-height: 1.1;
            color: #ff6b7a !important;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
        }

        #cartOffcanvas .cart-remove-btn-under-image {
            justify-content: center;
            width: 100%;
            font-size: 0.74rem;
        }

        #cartOffcanvas .cart-item-total-row {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.05rem;
            margin-left: auto;
        }

        #cartOffcanvas .cart-item-total-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.62);
            line-height: 1;
        }

        #cartOffcanvas .cart-item-total {
            font-size: 0.95rem;
            line-height: 1.15;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
        }

        #cartOffcanvas .cart-footer-actions-row {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            gap: 0.55rem;
            margin-top: 0.15rem;
        }

        #cartOffcanvas .cart-footer-actions-row > * {
            flex: 1 1 50%;
            min-width: 0;
        }

        #cartOffcanvas .cart-footer-mini-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            width: 100%;
            min-height: 34px;
            padding: 0.36rem 0.55rem;
            border-radius: 10px;
            font-size: 0.76rem;
            font-weight: 600;
            line-height: 1.1;
            text-decoration: none;
            white-space: nowrap;
        }

        #cartOffcanvas .cart-footer-mini-btn i {
            font-size: 0.78rem;
            line-height: 1;
        }

        #cartOffcanvas .cart-footer-mini-btn.btn-outline-light:hover {
            color: #111;
            background: #fff;
        }

        @media (max-width: 576px) {
            #cartOffcanvas .cart-offcanvas-main {
                grid-template-columns: 68px minmax(0, 1fr);
                gap: 0.7rem;
            }

            #cartOffcanvas .cart-offcanvas-media-box {
                width: 68px;
                min-width: 68px;
            }

            #cartOffcanvas .cart-item-media,
            #cartOffcanvas .cart-item-placeholder {
                width: 68px;
                height: 84px;
            }

            #cartOffcanvas .cart-footer-actions-row {
                gap: 0.45rem;
            }

            #cartOffcanvas .cart-footer-mini-btn {
                min-height: 32px;
                padding: 0.34rem 0.45rem;
                font-size: 0.72rem;
            }

            #cartOffcanvas .cart-footer-mini-btn i {
                font-size: 0.74rem;
            }
        }
    </style>

    <div class="offcanvas offcanvas-end text-bg-dark"
         tabindex="-1"
         id="cartOffcanvas"
         aria-labelledby="cartOffcanvasLabel">

        <div class="offcanvas-header border-bottom border-secondary-subtle">
            <h6 class="offcanvas-title d-flex align-items-center gap-2" id="cartOffcanvasLabel">
                <i class="bi bi-cart3"></i>
                Carrello
                <span class="badge bg-light text-dark small cart-count">0</span>
            </h6>

            <button type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="offcanvas"
                    aria-label="Chiudi"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column">

            <div id="cartEmptyState" class="text-center text-secondary py-5">
                <i class="bi bi-cart-x fs-1 d-block mb-3"></i>
                <p class="mb-0">Il carrello è vuoto</p>
            </div>

            <div id="cartItemsContainer" class="d-none flex-grow-1">
                <div id="cartItemsList" class="cart-offcanvas-list"></div>
            </div>

            <div id="cartFooter"
                 class="d-none border-top border-secondary-subtle pt-3 mt-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold">Totale</span>
                    <span class="fw-bold fs-5">€ <span id="cartTotal">0,00</span></span>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/checkout}" class="btn btn-primary">
                        <i class="bi bi-credit-card me-2"></i>
                        Vai al checkout
                    </a>

                    <div class="cart-footer-actions-row">
                        <button type="button"
                                id="clearCartBtn"
                                class="btn btn-outline-light cart-footer-mini-btn">
                            <i class="bi bi-trash3"></i>
                            <span>Svuota carrello</span>
                        </button>

                        <a th:href="@{/shop}"
                           class="btn btn-outline-light cart-footer-mini-btn">
                            <i class="bi bi-arrow-left"></i>
                            <span>Torna shop</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</th:block>

</body>
</html>
