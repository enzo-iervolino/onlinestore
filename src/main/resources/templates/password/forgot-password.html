<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recupero password | Online Store</title>
    <meta http-equiv="refresh" th:if="${forgotSent == true}" th:content="|30;url=@{/}|">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="row justify-content-center">
        <section class="col-sm-10 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 p-sm-5">
                    <h1 class="h3 mb-3">Recupero password</h1>
                    <p class="alert alert-success" role="status" th:if="${forgotSent == true}">
                        Email recupero inviata
                    </p>
                    <p id="forgotEmailError" class="alert alert-danger" role="alert"
                       th:if="${forgotError != null}" th:text="${forgotError}"></p>
                    <form th:action="@{/password/forgot}" method="post" th:unless="${forgotSent == true}">
                        <p>Inserisci l’email associata al tuo account.</p>
                        <div class="mb-3">
                            <label for="forgot-email" class="form-label">Email</label>
                            <input type="email" id="forgot-email" name="email"
                                   class="form-control border-secondary" autocomplete="email" th:value="${forgotEmail}"
                                   th:attr="aria-invalid=${forgotError != null},aria-describedby=${forgotError != null ? 'forgotEmailError' : null}"
                                   required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary">Invia link di recupero</button>
                    </form>
                    <a class="d-inline-block mt-4" th:if="${forgotSent == true}" th:href="@{/}">Torna alla home</a>
                    <a class="d-inline-block mt-4" th:unless="${forgotSent == true}" th:href="@{/login}">Torna all’accesso</a>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
