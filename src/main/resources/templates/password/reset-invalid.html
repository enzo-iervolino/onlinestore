<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Link non valido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0 text-center">
                <div class="card-body p-4">

                    <i class="bi bi-x-circle-fill text-danger fs-1 mb-3"></i>

                    <h4 class="text-danger mb-3">Link non valido</h4>

                    <p class="text-muted">
                        Il link per il reset della password è
                        <strong>scaduto</strong> oppure non è valido.
                    </p>

                    <a th:href="@{/password/forgot}"
                       class="btn btn-outline-primary mt-3 w-100">
                        Richiedi un nuovo link
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
