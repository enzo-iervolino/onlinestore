<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link non valido</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-lg border-0 text-center">
                <div class="card-body p-4">

                    <div class="alert alert-danger" role="alert">
                        <h1 class="h4">Link non valido o scaduto</h1>
                        <p class="mb-0">
                            Il link di recupero è scaduto, è già stato usato o è incompleto.
                            Dalla home puoi richiedere un nuovo link scegliendo «Password dimenticata?».
                        </p>
                    </div>

                    <a th:href="@{/}" class="btn btn-primary w-100">Torna alla home</a>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
