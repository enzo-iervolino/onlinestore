<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambia avatar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow border-0">
                <div class="card-body p-4 text-center">

                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h5 class="mt-2">Cambia immagine profilo</h5>

                    <form id="avatarForm"
                          enctype="multipart/form-data"
                          class="mt-4">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <input type="file"
                               name="avatar"
                               accept="image/*"
                               class="form-control mb-3"
                               required>

                        <div class="d-flex gap-2">
                            <!-- ANNULLA -->
							<a href="javascript:history.back()"
							   class="btn btn-outline-secondary w-50">
							    Annulla
							</a>

                            <!-- SALVA -->
                            <button type="submit"
                                    class="btn btn-primary w-50">
                                Salva avatar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
/* ===============================
   TORNA AL PROFILO (MODAL)
================================ */
function returnToProfile() {
    sessionStorage.setItem("openProfileModal", "true");
    window.location.href = "/";
}

/* ===============================
   SUBMIT AVATAR
================================ */
document.getElementById("avatarForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const form = this;
    const formData = new FormData(form);

    const csrfInput = form.querySelector('input[type="hidden"]');
    const csrfToken = csrfInput.value;
    const csrfHeader = csrfInput.name;

    fetch("/profile/avatar/upload", {
        method: "POST",
        headers: {
            [csrfHeader]: csrfToken
        },
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }
        return response.json();
    })
    .then(data => {
        if (!data.success) {
            alert(data.message || "Errore upload avatar");
            return;
        }

        // torna SEMPRE al profilo con modal aperto
        returnToProfile();
    })
    .catch(err => {
        console.error(err);
        alert("Errore durante il salvataggio avatar");
    });
});
</script>

</body>
</html>
