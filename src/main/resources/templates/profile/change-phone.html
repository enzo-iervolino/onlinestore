<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambia telefono</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow border-0">
                <div class="card-body p-4 text-center">

                    <i class="bi bi-telephone-fill fs-1 text-primary"></i>
                    <h5 class="mt-2">Cambia numero di telefono</h5>

                    <p class="text-muted small">
                        Inserisci un nuovo numero di telefono.<br>
                        Deve essere univoco.
                    </p>

                    <div th:if="${error}"
                         class="alert alert-danger small mt-3"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/profile/phone/save}"
                          method="post"
                          class="mt-4">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <input type="tel"
                               name="phone"
                               class="form-control mb-3"
                               placeholder="+39 333 1234567"
                               required>

                        <div class="d-flex gap-2">
							<a href="javascript:history.back()"
							   class="btn btn-outline-secondary w-50">
							    Annulla
							</a>
							</a>

                            <button type="submit"
                                    class="btn btn-primary w-50">
                                Salva telefono
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>





</body>
</html>
