<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password aggiornata</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">
                <div class="card-body text-center p-5">

                    <!-- ICONA -->
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success fs-1"></i>
                    </div>

                    <!-- TITOLO -->
                    <h4 class="mb-2">Password aggiornata con successo</h4>

                    <!-- TESTO -->
                    <p class="text-muted mb-4">
                        La tua password è stata modificata correttamente.<br>
                        Per motivi di sicurezza è necessario effettuare di nuovo l’accesso.
                    </p>

                    <!-- FORM LOGOUT -->
                    <form th:action="@{/logout}" method="post">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-box-arrow-right me-1"></i>
                            Conferma e vai al login
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
