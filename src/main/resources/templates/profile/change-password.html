<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambio password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <!-- HEADER -->
                    <div class="text-center mb-4">
                        <i class="bi bi-key-fill fs-1 text-primary"></i>
                        <h4 class="mt-2">Cambia password</h4>
                        <p class="text-muted mb-0">
                            Inserisci una nuova password per il tuo account
                        </p>
                    </div>

                    <!-- ERRORE -->
                    <div th:if="${error}"
                         class="alert alert-danger text-center"
                         th:text="${error}">
                    </div>

                    <form th:action="@{/password/change-password}" method="post">

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>

                        <!-- NUOVA PASSWORD -->
                        <div class="mb-3">
                            <label class="form-label">Nuova password</label>

                            <div class="input-group">
                                <input type="password"
                                       id="newPassword"
                                       name="newPassword"
                                       class="form-control"
                                       required
                                       minlength="6">

                                <span class="input-group-text bg-white"
                                      style="cursor:pointer"
                                      onclick="togglePassword('newPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>

                        <!-- CONFERMA PASSWORD -->
                        <div class="mb-4">
                            <label class="form-label">Conferma password</label>

                            <div class="input-group">
                                <input type="password"
                                       id="confirmPassword"
                                       name="confirmPassword"
                                       class="form-control"
                                       required
                                       minlength="6">

                                <span class="input-group-text bg-white"
                                      style="cursor:pointer"
                                      onclick="togglePassword('confirmPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>

                        <!-- AZIONI -->
                        <div class="d-flex gap-2">

                            <!-- ANNULLA -->
							<a href="javascript:history.back()"
							   class="btn btn-outline-secondary w-50">
							    Annulla
							</a>

                            <!-- SALVA -->
                            <button type="submit"
                                    class="btn btn-primary w-50">
                                <i class="bi bi-check-circle me-1"></i>
                                Salva
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- JS TOGGLE PASSWORD -->
<script>
    function togglePassword(inputId, iconWrapper) {
        const input = document.getElementById(inputId);
        const icon = iconWrapper.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }
</script>

</body>
</html>
