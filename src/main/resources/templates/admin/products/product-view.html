<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle != null} ? pageTitle : 'Dettaglio prodotto'">Dettaglio prodotto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .ro-box{
            padding:.6rem .75rem;
            border:1px solid rgba(0,0,0,.15);
            border-radius:.5rem;
            background:#fff;
            min-height:38px;
            display:flex;
            align-items:center;
        }
        .ro-box.multiline{
            align-items:flex-start;
        }
        .ro-muted{color:#6c757d;font-style:italic;}

        .thumb{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #eee;}
        .main-img{max-width:100%;max-height:220px;object-fit:cover;border-radius:6px;border:1px solid #eee;}
    </style>
</head>

<body>
<div class="container my-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">Dettaglio prodotto</h1>
            <div class="text-muted small">
                ID prodotto: <strong th:text="${product.id}">1</strong>
            </div>
        </div>

        <div class="d-flex gap-2 align-items-center">
            <a th:href="@{/admin/products(categoryId=${selectedCategoryId}, q=${searchText})}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Lista
            </a>

            <a class="btn btn-outline-primary"
               th:href="@{/admin/products/view/{id}(id=${prevId}, categoryId=${selectedCategoryId}, q=${searchText})}"
               th:classappend="${prevId == null} ? ' disabled' : ''"
               th:attr="aria-disabled=${prevId == null}"
               title="Prodotto precedente">
                <i class="bi bi-chevron-left"></i> Indietro
            </a>

            <a class="btn btn-outline-primary"
               th:href="@{/admin/products/view/{id}(id=${nextId}, categoryId=${selectedCategoryId}, q=${searchText})}"
               th:classappend="${nextId == null} ? ' disabled' : ''"
               th:attr="aria-disabled=${nextId == null}"
               title="Prodotto successivo">
                Avanti <i class="bi bi-chevron-right"></i>
            </a>

            <a class="btn btn-primary"
               th:href="@{/admin/products/edit/{id}(id=${product.id})}">
                <i class="bi bi-pencil"></i> Modifica
            </a>
        </div>
    </div>

    <div class="row g-3">

        <!-- SINISTRA -->
        <div class="col-lg-8">

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Codice prodotto</label>
                    <div class="ro-box">
                        <span th:text="${product.codpro}">ART-001</span>
                    </div>
                </div>

                <div class="col-md-8 mb-3">
                    <label class="form-label">Nome</label>
                    <div class="ro-box">
                        <span th:text="${product.name}">Nome prodotto</span>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Categoria</label>
                    <div class="ro-box">
                        <span th:text="${product.category?.name}">Categoria</span>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Prezzo (€)</label>
                    <div class="ro-box">
                        <span th:text="${#numbers.formatDecimal(product.price,1,'COMMA',2,'POINT')}">0,00</span>
                    </div>
                </div>
            
				<div class="col-md-4 mb-3">
				                    <label class="form-label">Stock </label>
				                    <div class="ro-box">
				                        <span th:text="${#numbers.formatDecimal(product.stockQty,1,'COMMA',2,'POINT')}">0,00</span>
				                    </div>
				                </div>
				
				
				</div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Gruppo ID</label>
                    <div class="ro-box">
                        <span th:text="${product.groupId != null ? product.groupId : '-'}">-</span>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Sottogruppo ID</label>
                    <div class="ro-box">
                        <span th:text="${product.subgroupId != null ? product.subgroupId : '-'}">-</span>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Brand ID</label>
                    <div class="ro-box">
                        <span th:text="${product.brandId != null ? product.brandId : '-'}">-</span>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Famiglia ID</label>
                    <div class="ro-box">
                        <span th:text="${product.familyId != null ? product.familyId : '-'}">-</span>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Sottofamiglia ID</label>
                    <div class="ro-box">
                        <span th:text="${product.subfamilyId != null ? product.subfamilyId : '-'}">-</span>
                    </div>
                </div>
            </div>

            <!-- DESCRIZIONE -->
            <div class="mb-3">
                <label class="form-label d-flex align-items-center gap-2">
                    <i class="bi bi-card-text"></i><span>Descrizione</span>
                </label>

                <div class="ro-box multiline bg-light">
                    <div th:if="${product.description != null and !#strings.isEmpty(product.description)}"
                         th:utext="${#strings.replace(#strings.escapeXml(product.description), '\n', '<br/>')}">
                    </div>

                    <div th:if="${product.description == null or #strings.isEmpty(product.description)}"
                         class="ro-muted">
                        -
                    </div>
                </div>
            </div>

            <!-- MATERIALI -->
            <div class="mb-3">
                <label class="form-label d-flex align-items-center gap-2">
                    <i class="bi bi-box-seam"></i><span>Materiali</span>
                </label>

                <div class="ro-box multiline bg-light">
                    <div th:if="${product.materials != null and !#strings.isEmpty(product.materials)}"
                         th:utext="${#strings.replace(#strings.escapeXml(product.materials), '\n', '<br/>')}">
                    </div>

                    <div th:if="${product.materials == null or #strings.isEmpty(product.materials)}"
                         class="ro-muted">
                        -
                    </div>
                </div>
            </div>

            <!-- INFO SPEDIZIONE -->
            <div class="mb-3">
                <label class="form-label d-flex align-items-center gap-2">
                    <i class="bi bi-truck"></i><span>Info spedizione</span>
                </label>

                <div class="ro-box multiline bg-light">
                    <div th:if="${product.shippingInfo != null and !#strings.isEmpty(product.shippingInfo)}"
                         th:utext="${#strings.replace(#strings.escapeXml(product.shippingInfo), '\n', '<br/>')}">
                    </div>

                    <div th:if="${product.shippingInfo == null or #strings.isEmpty(product.shippingInfo)}"
                         class="ro-muted">
                        -
                    </div>
                </div>
            </div>

        </div>

        <!-- DESTRA -->
        <div class="col-lg-4">

            <!-- MEDIA PRINCIPALE -->
            <div class="card mb-3">
                <div class="card-header">Media principale</div>
                <div class="card-body text-center">
                    <img th:if="${product.image != null and (product.mainMediaType == null or product.mainMediaType == 'IMAGE')}"
                         th:src="${product.image}"
                         class="main-img"
                         alt="Media principale">

                    <video th:if="${product.image != null and product.mainMediaType == 'VIDEO'}"
                           class="main-img"
                           controls
                           playsinline
                           preload="metadata"
                           th:poster="${product.mainVideoPoster != null ? product.mainVideoPoster : null}">
                        <source th:src="${product.image}" type="video/mp4">
                    </video>

                    <div th:if="${product.image == null}"
                         class="text-muted small">
                        Nessun media principale
                    </div>
                </div>
            </div>

            <!-- MEDIA EXTRA -->
            <div class="card">
                <div class="card-header">Media aggiuntivi</div>
                <div class="card-body">

                    <div th:if="${product.images != null and !product.images.isEmpty()}"
                         class="d-flex flex-wrap gap-2">
                        <th:block th:each="img : ${product.images}">
                            <img th:if="${img.mediaType == null or img.mediaType == 'IMAGE'}"
                                 th:src="${img.imageUrl}"
                                 th:alt="${img.altText}"
                                 class="thumb">

                            <video th:if="${img.mediaType == 'VIDEO'}"
                                   class="thumb"
                                   muted
                                   playsinline
                                   preload="metadata"
                                   th:poster="${img.posterUrl != null ? img.posterUrl : product.mainVideoPoster}">
                                <source th:src="${img.imageUrl}" type="video/mp4">
                            </video>
                        </th:block>
                    </div>

                    <div th:if="${product.images == null or product.images.isEmpty()}"
                         class="text-muted small">
                        Nessun media aggiuntivo
                    </div>

                </div>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
