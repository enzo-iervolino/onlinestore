<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista categorie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <style>
        .category-thumb-link {
            display: inline-block;
            text-decoration: none;
        }

        .category-thumb {
            width: 64px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            background-color: #f8f9fa;
        }

        .category-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 0.35rem 0.9rem rgba(0, 0, 0, 0.18);
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .actions-col {
            white-space: nowrap;
            width: 1%;
        }

        .empty-thumb {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 48px;
            border-radius: 8px;
            border: 1px dashed #ced4da;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 12px;
        }

        .category-code {
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .category-name {
            font-weight: 500;
        }

        .toolbar-card {
            border: 0;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }

        .table-card {
            border: 0;
            box-shadow: 0 .125rem .25rem rgba(0,0,0,.075);
        }
    </style>
</head>
<body>
<div class="container py-4">

    
    
	<div class="d-flex justify-content-between align-items-center mb-2">
		    <h1 class="h5 mb-0">Gestione Categorie</h1>

		    <div class="d-flex gap-2">
		      <a class="btn btn-sm btn-primary" href="/admin/categories/new">+ Nuova categoria</a>
		      <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/dashboard}">Dashboard</a>
		    </div>
		  </div>
	
	
	
	
	
	
	
	
	
	<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card toolbar-card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/admin/categories}" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label for="keyword" class="form-label">Ricerca</label>
                    <input type="text"
                           id="keyword"
                           name="keyword"
                           class="form-control"
                           placeholder="Cerca per codice, nome o descrizione"
                           th:value="${keyword}">
                </div>

                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary">Cerca</button>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card table-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Immagine</th>
                        <th>Codice</th>
                        <th>Nome</th>
                        <th>Ordine</th>
                        <th>Stato</th>
                        <th class="actions-col text-end">Azioni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            Nessuna categoria trovata
                        </td>
                    </tr>

                    <tr th:each="category : ${categories}">
                        <td th:text="${category.id}">1</td>

                        <td>
                            <a th:if="${category.imageUrl != null and !#strings.isEmpty(category.imageUrl)}"
                               th:href="@{/admin/categories/{id}(id=${category.id})}"
                               class="category-thumb-link"
                               title="Apri dettaglio categoria">
                                <img th:src="${category.imageUrl}"
                                     alt="Immagine categoria"
                                     class="category-thumb">
                            </a>

                            <a th:unless="${category.imageUrl != null and !#strings.isEmpty(category.imageUrl)}"
                               th:href="@{/admin/categories/{id}(id=${category.id})}"
                               class="category-thumb-link"
                               title="Apri dettaglio categoria">
                                <span class="empty-thumb">No img</span>
                            </a>
                        </td>

                        <td>
                            <span class="category-code" th:text="${category.code}">CAT001</span>
                        </td>

                        <td>
                            <div class="category-name" th:text="${category.name}">Categoria demo</div>
                            <small class="text-muted"
                                   th:if="${category.description != null and !#strings.isEmpty(category.description)}"
                                   th:text="${#strings.length(category.description) > 70 ? #strings.substring(category.description, 0, 70) + '...' : category.description}">
                                Descrizione
                            </small>
                        </td>

                        <td th:text="${category.sortOrder != null ? category.sortOrder : '-'}">0</td>

                        <td>
                            <span th:if="${category.enabled}" class="badge text-bg-success">Attiva</span>
                            <span th:unless="${category.enabled}" class="badge text-bg-secondary">Disattiva</span>
                        </td>

                        <td class="text-end actions-col">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/admin/categories/{id}(id=${category.id})}"
                                   class="btn btn-sm btn-outline-info">
                                    View
                                </a>

                                <a th:href="@{/admin/categories/{id}/edit(id=${category.id})}"
                                   class="btn btn-sm btn-outline-warning">
                                    Edit
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
