<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movimenti GiftCard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h3 class="mb-3">📊 Movimenti GiftCard</h3>

    <!-- FILTRI -->
    <form method="get" class="row g-3 mb-4">

        <div class="col-md-3">
            <input type="text"
                   name="code"
                   th:value="${code}"
                   class="form-control"
                   placeholder="Codice GiftCard">
        </div>

        <div class="col-md-3">
            <input type="date"
                   name="from"
                   th:value="${from}"
                   class="form-control">
        </div>

        <div class="col-md-3">
            <input type="date"
                   name="to"
                   th:value="${to}"
                   class="form-control">
        </div>

        <div class="col-md-3">
            <button class="btn btn-primary w-100">
                Filtra
            </button>
        </div>
    </form>

    <!-- TABELLA -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Codice</th>
                    <th>Ordine</th>
                    <th>Importo Usato</th>
                    <th>Data</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="m : ${movements}">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.giftCard.code}"></td>
                    <td>
                        <a th:href="@{/admin/orders/{id}(id=${m.orderId})}"
                           th:text="${m.orderId}"></a>
                    </td>
                    <td class="text-danger"
                        th:text="'- € ' + ${#numbers.formatDecimal(m.amountUsed,1,2)}">
                    </td>
                    <td th:text="${#temporals.format(m.usedAt,'dd/MM/yyyy HH:mm')}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(movements)}">
                    <td colspan="5" class="text-center p-4">
                        Nessun movimento trovato
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

</div>

</body>
</html>
