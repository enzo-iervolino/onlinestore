<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Tipo ordine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0" th:text="${pageTitle}">Tipo ordine</h1>
            <div class="text-muted small">Tabella: <strong>type_order</strong></div>
        </div>
        <a class="btn btn-secondary" th:href="@{/admin/order-types}">
            <i class="bi bi-arrow-left"></i> Lista tipi ordine
        </a>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Errore</div>

    <form th:action="@{/admin/order-types/save}" th:object="${orderType}" method="post" class="card">
        <div class="card-body">
            <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Codice</label>
                    <input class="form-control"
                           th:field="*{code}"
                           placeholder="Es. STRIPE"
                           maxlength="10"
                           required>
                    <div class="form-text">Unico, maiuscolo, max 10 caratteri</div>
                </div>

                <div class="col-md-9">
                    <label class="form-label">Descrizione</label>
                    <input class="form-control"
                           th:field="*{descri}"
                           placeholder="Es. Pagamento Stripe"
                           maxlength="80"
                           required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <a class="btn btn-outline-secondary" th:href="@{/admin/order-types}">Annulla</a>
                <button class="btn btn-primary" type="submit">Salva</button>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
