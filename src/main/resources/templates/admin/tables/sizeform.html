<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle}">Taglia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0" th:text="${pageTitle}">Taglia</h1>
            <div class="text-muted small">Tabella: <strong>size_options</strong></div>
        </div>

        <a class="btn btn-secondary" th:href="@{/admin/sizes}">
            <i class="bi bi-arrow-left"></i> Lista taglie
        </a>
    </div>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Errore</div>

    <form th:action="@{/admin/sizes/save}" th:object="${size}" method="post" class="card">
        <div class="card-body">
            <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Codice</label>
                    <input class="form-control" th:field="*{code}" placeholder="Es. M / 42 / TU" maxlength="10" required>
                    <div class="form-text">Unico (TU, XS, M, 42...)</div>
                </div>

                <div class="col-md-8">
                    <label class="form-label">Nome (IT)</label>
                    <input class="form-control" th:field="*{nameIt}" placeholder="Es. TAGLIA UNICA / 42" maxlength="80" required>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <a class="btn btn-outline-secondary" th:href="@{/admin/sizes}">Annulla</a>
                <button class="btn btn-primary" type="submit">Salva</button>
            </div>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
