<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle}">Colore</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .swatch{
      width: 34px; height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.15);
      display:inline-block;
      vertical-align: middle;
    }
    .swatch-multi{
      background: repeating-linear-gradient(
              45deg,
              #ff4d4d 0 10px,
              #ffd24d 10px 20px,
              #4dff88 20px 30px,
              #4dd2ff 30px 40px,
              #b84dff 40px 50px
      );
    }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h1 class="h3 mb-0" th:text="${pageTitle}">Colore</h1>
      <div class="text-muted small">Tabella: <strong>color_options</strong></div>
    </div>
    <a class="btn btn-secondary" th:href="@{/admin/colors}">
      <i class="bi bi-arrow-left"></i> Lista colori
    </a>
  </div>

  <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Errore</div>

  <form th:action="@{/admin/colors/save}" th:object="${color}" method="post" class="card">
    <div class="card-body">
      <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Codice</label>
          <input class="form-control" th:field="*{code}" placeholder="Es. BLK" maxlength="10" required>
          <div class="form-text">Unico (es. BLK, WHT, BEI)</div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Nome (IT)</label>
          <input class="form-control" th:field="*{nameIt}" placeholder="Es. NERO" maxlength="80" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Anteprima</label>
          <div>
            <span class="swatch"
                  th:if="*{hex != null and !#strings.isEmpty(hex)}"
                  th:style="'background-color:' + *{hex}"></span>

            <span class="swatch"
                  th:if="*{(hex == null or #strings.isEmpty(hex)) and (rgb != null and !#strings.isEmpty(rgb))}"
                  th:style="'background-color: rgb(' + *{rgb} + ')'}"></span>

            <span class="swatch swatch-multi"
                  th:if="*{(hex == null or #strings.isEmpty(hex)) and (rgb == null or #strings.isEmpty(rgb))}"></span>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">HEX</label>
          <input class="form-control" th:field="*{hex}" placeholder="#000000" maxlength="7">
          <div class="form-text">Formato #RRGGBB (opzionale)</div>
        </div>

        <div class="col-md-6">
          <label class="form-label">RGB</label>
          <input class="form-control" th:field="*{rgb}" placeholder="0,0,0" maxlength="20">
          <div class="form-text">Formato “r,g,b” (opzionale)</div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <a class="btn btn-outline-secondary" th:href="@{/admin/colors}">Annulla</a>
        <button class="btn btn-primary" type="submit">Salva</button>
      </div>
    </div>
  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
