<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Tabella</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <div class="mb-4">
        <h1 class="h3 mb-1" th:text="${pageTitle}">Tabella</h1>
        <p class="text-muted mb-0">
            <span th:if="${isEdit}">Modifica i dati</span>
            <span th:unless="${isEdit}">Inserisci un nuovo record</span>
        </p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form th:action="${formAction}" th:object="${lookup}" method="post" enctype="multipart/form-data">

                <input type="hidden" th:if="*{id != null}" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="code" class="form-label">Codice *</label>
                        <input type="text"
                               id="code"
                               th:field="*{code}"
                               class="form-control"
                               maxlength="50"
                               placeholder="Es. UOMO"
                               required>
                    </div>

                    <div class="col-12">
                        <label for="descri" class="form-label">Descrizione</label>
                        <textarea id="descri"
                                  th:field="*{descri}"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Descrizione"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="imageFile" class="form-label">Immagine da file</label>
                        <input type="file"
                               id="imageFile"
                               name="imageFile"
                               class="form-control"
                               accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">

                        <div class="form-text">
                            Formati consentiti: JPG, JPEG, PNG, WEBP
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="imageUrl" class="form-label">Image URL</label>
                        <input type="text"
                               id="imageUrl"
                               th:field="*{imageUrl}"
                               class="form-control"
                               maxlength="500"
                               placeholder="https://... oppure /uploads/...">

                        <div class="form-text">
                            Puoi usare un URL oppure caricare un file. Se selezioni un file, verrà mostrata l'anteprima.
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Anteprima immagine</label>

                        <div id="previewWrapper"
                             class="border rounded p-3 bg-light text-center"
                             th:style="${lookup.imageUrl != null and !#strings.isEmpty(lookup.imageUrl)} ? '' : 'display:none;'">

                            <img id="imagePreview"
                                 th:src="${lookup.imageUrl != null and !#strings.isEmpty(lookup.imageUrl) ? lookup.imageUrl : ''}"
                                 alt="Anteprima immagine"
                                 class="img-fluid rounded"
                                 style="max-width: 100%; max-height: 260px; object-fit: contain;">
                        </div>

                        <div id="previewPlaceholder"
                             class="border rounded p-4 bg-light text-center text-muted"
                             th:style="${lookup.imageUrl != null and !#strings.isEmpty(lookup.imageUrl)} ? 'display:none;' : ''">
                            Nessuna immagine selezionata
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">
                        <span th:if="${isEdit}">Aggiorna</span>
                        <span th:unless="${isEdit}">Salva</span>
                    </button>

                    <a th:href="${basePath}" class="btn btn-outline-secondary">Indietro</a>

                    <a th:if="${isEdit}"
                       th:href="${basePath + '/' + lookup.id}"
                       class="btn btn-outline-info">
                        View
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const imageFileInput = document.getElementById('imageFile');
        const imageUrlInput = document.getElementById('imageUrl');
        const previewWrapper = document.getElementById('previewWrapper');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const imagePreview = document.getElementById('imagePreview');

        function showPreview(src) {
            imagePreview.src = src;
            previewWrapper.style.display = 'block';
            previewPlaceholder.style.display = 'none';
        }

        function hidePreview() {
            imagePreview.src = '';
            previewWrapper.style.display = 'none';
            previewPlaceholder.style.display = 'block';
        }

        imageFileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];

            if (file) {
                const objectUrl = URL.createObjectURL(file);
                showPreview(objectUrl);
            } else {
                const currentUrl = imageUrlInput.value ? imageUrlInput.value.trim() : '';
                if (currentUrl) {
                    showPreview(currentUrl);
                } else {
                    hidePreview();
                }
            }
        });

        imageUrlInput.addEventListener('input', function () {
            if (imageFileInput.files && imageFileInput.files.length > 0) {
                return;
            }

            const url = imageUrlInput.value ? imageUrlInput.value.trim() : '';
            if (url) {
                showPreview(url);
            } else {
                hidePreview();
            }
        });
    });
</script>
</body>
</html>
