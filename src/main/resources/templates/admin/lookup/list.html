<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Gestione tabella</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <style>
        .lookup-thumb-link {
            display: inline-block;
            text-decoration: none;
        }

        .lookup-thumb {
            width: 64px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            background-color: #f8f9fa;
        }

        .lookup-thumb:hover {
            transform: scale(1.08);
            box-shadow: 0 0.35rem 0.9rem rgba(0, 0, 0, 0.18);
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .table-card,
        .search-card {
            border: 0;
            box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.05);
        }

        .lookup-code {
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .empty-thumb {
            width: 64px;
            height: 48px;
            border: 1px dashed #ced4da;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 0.75rem;
            background: #f8f9fa;
        }

        .actions-col {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container-fluid py-3">

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 mb-0" th:text="${pageTitle}">Gestione tabella</h1>
        <div class="d-flex gap-2">
            <a th:href="${basePath + '/new'}" class="btn btn-primary btn-sm">
                + <span th:text="${entitySingular}">Nuovo</span>
            </a>
            <a th:href="${dashboardPath}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
        </div>
    </div>

    <div class="card search-card mb-4">
        <div class="card-body">
            <form method="get" th:action="${basePath}" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label for="keyword" class="form-label">Ricerca</label>
                    <input type="text"
                           id="keyword"
                           name="keyword"
                           class="form-control"
                           placeholder="Cerca per codice o descrizione"
                           th:value="${keyword}">
                </div>

                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-outline-primary">Cerca</button>
                    <a th:href="${basePath}" class="btn btn-outline-secondary">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card table-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Immagine</th>
                        <th>Codice</th>
                        <th>Descrizione</th>
                        <th class="actions-col text-end">Azioni</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            Nessun record trovato
                        </td>
                    </tr>

                    <tr th:each="item : ${items}">
                        <td th:text="${item.id}">1</td>

                        <td>
                            <a th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                               th:href="${basePath + '/' + item.id}"
                               class="lookup-thumb-link"
                               title="Apri dettaglio">
                                <img th:src="${item.imageUrl}"
                                     alt="Immagine"
                                     class="lookup-thumb">
                            </a>

                            <a th:unless="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                               th:href="${basePath + '/' + item.id}"
                               class="lookup-thumb-link"
                               title="Apri dettaglio">
                                <span class="empty-thumb">No img</span>
                            </a>
                        </td>

                        <td>
                            <span class="lookup-code" th:text="${item.code}">COD</span>
                        </td>

                        <td>
                            <span th:if="${item.descri != null and !#strings.isEmpty(item.descri)}"
                                  th:text="${#strings.length(item.descri) > 120 ? #strings.substring(item.descri, 0, 120) + '...' : item.descri}">
                                Descrizione
                            </span>
                            <span th:unless="${item.descri != null and !#strings.isEmpty(item.descri)}" class="text-muted">-</span>
                        </td>

                        <td class="text-end actions-col">
                            <div class="d-inline-flex gap-2">
                                <a th:href="${basePath + '/' + item.id}"
                                   class="btn btn-sm btn-outline-info">
                                    View
                                </a>

                                <a th:href="${basePath + '/' + item.id + '/edit'}"
                                   class="btn btn-sm btn-outline-warning">
                                    Edit
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
