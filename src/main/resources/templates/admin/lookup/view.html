<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Dettaglio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="${pageTitle}">Dettaglio</h1>
            <p class="text-muted mb-0">Visualizzazione dati</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="${basePath + '/' + item.id + '/edit'}" class="btn btn-warning">
                Modifica
            </a>
            <a th:href="${basePath}" class="btn btn-outline-secondary">
                Lista
            </a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="row g-4">

                <div class="col-lg-4">
                    <label class="form-label text-muted">Immagine</label>

                    <div th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                         class="border rounded p-2 bg-light text-center">
                        <img th:src="${item.imageUrl}"
                             alt="Immagine"
                             class="img-fluid rounded"
                             style="max-width: 100%; max-height: 320px; object-fit: contain;">
                    </div>

                    <div th:unless="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                         class="border rounded p-4 bg-light text-center text-muted">
                        Nessuna immagine disponibile
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label text-muted">ID</label>
                            <div class="fw-semibold" th:text="${item.id}">1</div>
                        </div>

                        <div class="col-md-9">
                            <label class="form-label text-muted">Codice</label>
                            <div class="fw-semibold" th:text="${item.code}">COD</div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted">Image URL</label>
                            <div class="text-break"
                                 th:text="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl) ? item.imageUrl : '-'}">
                                -
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted">Descrizione</label>
                            <div class="border rounded p-3 bg-light"
                                 th:text="${item.descri != null and !#strings.isEmpty(item.descri) ? item.descri : 'Nessuna descrizione'}">
                                Nessuna descrizione
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted">Creato il</label>
                            <div th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm') : '-'}">-</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted">Ultimo aggiornamento</label>
                            <div th:text="${item.updatedAt != null ? #temporals.format(item.updatedAt, 'dd/MM/yyyy HH:mm') : '-'}">-</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>
</body>
</html>
