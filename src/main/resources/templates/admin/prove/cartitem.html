<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CartItemDTO reali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .mono { font-family: Consolas, Monaco, monospace; font-size: .92rem; }
        .card-box {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="card-box">
        <h2 class="mb-3">CartItemDTO reali dal carrello in sessione</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-light">
                <tr>
                    <th>productId</th>
                    <th>variantId</th>
                    <th>productName</th>
                    <th>sku</th>
                    <th>productCode</th>
                    <th>variantCode</th>
                    <th>color</th>
                    <th>size</th>
                    <th>quantity</th>
                    <th>unitPrice</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="10" class="text-center text-muted">Carrello vuoto oppure nessun item in sessione</td>
                </tr>

                <tr th:each="item : ${items}">
                    <td th:text="${item.productId}">-</td>
                    <td th:text="${item.variantId}">-</td>
                    <td th:text="${item.productName}">-</td>
                    <td th:text="${item.sku}">-</td>
                    <td th:text="${item.productCode}">-</td>
                    <td th:text="${item.variantCode}">-</td>
                    <td th:text="${item.color}">-</td>
                    <td th:text="${item.size}">-</td>
                    <td th:text="${item.quantity}">-</td>
                    <td th:text="${item.unitPrice}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
