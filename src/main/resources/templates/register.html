<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Register')}"></head>

<style>
    .auth-page {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0.75rem 1rem;
        width: 100%;
    }

    .auth-card-page {
        width: 100%;
        max-width: 720px;
    }

    .auth-card {
        margin-left: auto;
        margin-right: auto;
    }

    .modal-header {
        padding: 0.65rem 1rem;
    }

    .modal-header h3 {
        font-size: 1rem;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }

    .modal-body {
        padding: 0.85rem 1rem;
    }

    .auth-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 8px 14px;
        width: 100%;
    }

    .auth-field {
        width: 100%;
    }

    .auth-field label {
        display: block;
        font-size: 0.72rem;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.1;
    }

    .auth-input {
        width: 100%;
        min-width: 0;
        height: 32px;
        font-size: 0.78rem;
        padding: 4px 9px;
        line-height: 1.2;
    }

    .auth-input[type="file"] {
        height: 32px;
        padding: 4px 9px;
        font-size: 0.72rem;
    }

    .auth-input:disabled {
        background-color: #f2f2f2;
        cursor: not-allowed;
        opacity: 0.7;
    }

    .auth-hint {
        font-size: 0.68rem;
        margin-top: 2px;
        line-height: 1.1;
        opacity: 0.75;
    }

    .auth-alert {
        font-size: 0.78rem;
        margin-bottom: 0.65rem;
        padding: 0.45rem 0.65rem;
    }

    .auth-section-title {
        grid-column: 1 / -1;
        font-size: 0.76rem;
        font-weight: 700;
        margin-top: 2px;
        padding-top: 0;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        line-height: 1.1;
    }

    .auth-span-2 {
        grid-column: 1 / -1;
    }

    .auth-btn {
        width: 100%;
        height: 34px;
        font-size: 0.78rem;
        font-weight: 700;
        padding: 4px 12px;
        line-height: 1.2;
    }

    .auth-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .auth-note {
        font-size: 0.72rem;
        text-align: center;
        margin-top: 0.65rem;
    }

    .auth-link {
        font-size: 0.72rem;
        font-weight: 700;
    }

    .auth-check-message {
        font-size: 0.68rem;
        margin-top: 2px;
        min-height: 12px;
        line-height: 1.1;
    }

    .auth-check-message.ok {
        color: #198754;
    }

    .auth-check-message.error {
        color: #dc3545;
    }

    .auth-input.input-ok {
        border-color: #198754;
    }

    .auth-input.input-error {
        border-color: #dc3545;
    }

    @media (max-width: 768px) {
        .auth-page {
            padding: 0.75rem 0.65rem;
        }

        .auth-card-page {
            max-width: 100%;
        }

        .modal-header {
            padding: 0.6rem 0.85rem;
        }

        .modal-body {
            padding: 0.8rem;
        }

        .auth-form-grid {
            grid-template-columns: 1fr;
            gap: 7px;
        }

        .auth-input {
            height: 31px;
        }

        .auth-span-2,
        .auth-section-title {
            grid-column: 1;
        }
    }
</style>

<body class="shop-page">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-page">
    <div class="auth-card auth-card-page">

        <div class="modal-header">
            <h3>
                <i class="bi bi-person-plus"></i>
                Crea il tuo account
            </h3>
        </div>

        <div class="modal-body">

            <div class="auth-alert"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <div class="auth-alert ok"
                 th:if="${param.registered}">
                Registrazione completata. Ora puoi accedere.
            </div>

            <form th:action="@{/register}"
                  method="post"
                  enctype="multipart/form-data"
                  class="auth-form-grid"
                  id="registerForm">

                <div class="auth-field">
                    <label for="email">Email *</label>
                    <input class="auth-input"
                           type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           required>
                    <div id="emailCheckMessage" class="auth-check-message"></div>
                </div>

                <div class="auth-field">
                    <label for="phone">Telefono *</label>
                    <input class="auth-input"
                           type="tel"
                           id="phone"
                           name="phone"
                           autocomplete="tel"
                           required
                           disabled>
                    <div id="phoneCheckMessage" class="auth-check-message"></div>
                </div>

                <div class="auth-field">
                    <label for="password">Password *</label>
                    <input class="auth-input lock-after-phone"
                           type="password"
                           id="password"
                           name="password"
                           autocomplete="new-password"
                           required
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="confirmPassword">Conferma password *</label>
                    <input class="auth-input lock-after-phone"
                           type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           autocomplete="new-password"
                           required
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="firstname">Nome</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="firstname"
                           name="firstname"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="lastname">Cognome</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="lastname"
                           name="lastname"
                           disabled>
                </div>

                <div class="auth-field auth-span-2">
                    <label for="avatarFile">Avatar</label>
                    <input class="auth-input lock-after-phone"
                           type="file"
                           id="avatarFile"
                           name="avatarFile"
                           accept="image/*"
                           disabled>
                    <div class="auth-hint">
                        JPG / PNG – opzionale
                    </div>
                </div>

                <div class="auth-section-title">
                    <i class="bi bi-geo-alt"></i>
                    Indirizzo
                </div>

                <div class="auth-field">
                    <label for="street">Via</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="street"
                           name="street"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="city">Città</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="city"
                           name="city"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="zipcode">CAP</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="zipcode"
                           name="zipcode"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="province">Provincia</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="province"
                           name="province"
                           disabled>
                </div>

                <div class="auth-span-2">
                    <button type="submit" class="auth-btn" id="registerSubmit" disabled>
                        Registrati
                    </button>
                </div>

            </form>

            <div class="auth-note">
                Hai già un account?
                <a th:href="@{/login}" class="auth-link">Accedi</a>
            </div>

        </div>
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phone");
        const emailMessage = document.getElementById("emailCheckMessage");
        const phoneMessage = document.getElementById("phoneCheckMessage");
        const submitButton = document.getElementById("registerSubmit");
        const fieldsAfterPhone = document.querySelectorAll(".lock-after-phone");
        const form = document.getElementById("registerForm");

        let emailValid = false;
        let phoneValid = false;
        let emailTimer = null;
        let phoneTimer = null;

        function setMessage(input, messageBox, type, message) {
            messageBox.textContent = message || "";
            messageBox.classList.remove("ok", "error");
            input.classList.remove("input-ok", "input-error");

            if (type === "ok") {
                messageBox.classList.add("ok");
                input.classList.add("input-ok");
            }

            if (type === "error") {
                messageBox.classList.add("error");
                input.classList.add("input-error");
            }
        }

        function disablePhoneAndNextFields() {
            phoneValid = false;
            phoneInput.disabled = true;
            phoneInput.value = "";
            setMessage(phoneInput, phoneMessage, "", "");

            fieldsAfterPhone.forEach(field => {
                field.disabled = true;
                if (field.type !== "file") {
                    field.value = "";
                }
            });

            submitButton.disabled = true;
        }

        function enablePhoneField() {
            phoneInput.disabled = false;
        }

        function disableNextFieldsAfterPhone() {
            phoneValid = false;

            fieldsAfterPhone.forEach(field => {
                field.disabled = true;
                if (field.type !== "file") {
                    field.value = "";
                }
            });

            submitButton.disabled = true;
        }

        function enableNextFieldsAfterPhone() {
            fieldsAfterPhone.forEach(field => {
                field.disabled = false;
            });

            submitButton.disabled = false;
        }

        function checkEmail(moveNext) {
            const email = emailInput.value.trim();

            emailValid = false;
            disablePhoneAndNextFields();

            if (email.length < 5 || !email.includes("@")) {
                setMessage(emailInput, emailMessage, "", "");
                return;
            }

            fetch("/register/check-email?email=" + encodeURIComponent(email))
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        emailValid = false;
                        setMessage(emailInput, emailMessage, "error", data.message || "Email già registrata.");
                        disablePhoneAndNextFields();

                        setTimeout(() => {
                            emailInput.focus();
                            emailInput.select();
                        }, 50);

                        return;
                    }

                    emailValid = true;
                    setMessage(emailInput, emailMessage, "ok", data.message || "Email disponibile.");
                    enablePhoneField();

                    if (moveNext) {
                        setTimeout(() => {
                            phoneInput.focus();
                        }, 50);
                    }
                })
                .catch(() => {
                    emailValid = false;
                    setMessage(emailInput, emailMessage, "error", "Impossibile verificare l'email.");
                    disablePhoneAndNextFields();

                    setTimeout(() => {
                        emailInput.focus();
                    }, 50);
                });
        }

        function checkPhone(moveNext) {
            const phone = phoneInput.value.trim();

            phoneValid = false;
            disableNextFieldsAfterPhone();

            if (!emailValid) {
                setTimeout(() => {
                    emailInput.focus();
                }, 50);
                return;
            }

            if (phone.length < 5) {
                setMessage(phoneInput, phoneMessage, "", "");
                return;
            }

            fetch("/register/check-phone?phone=" + encodeURIComponent(phone))
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        phoneValid = false;
                        setMessage(phoneInput, phoneMessage, "error", data.message || "Telefono già registrato.");
                        disableNextFieldsAfterPhone();

                        setTimeout(() => {
                            phoneInput.focus();
                            phoneInput.select();
                        }, 50);

                        return;
                    }

                    phoneValid = true;
                    setMessage(phoneInput, phoneMessage, "ok", data.message || "Telefono disponibile.");
                    enableNextFieldsAfterPhone();

                    if (moveNext) {
                        setTimeout(() => {
                            document.getElementById("password").focus();
                        }, 50);
                    }
                })
                .catch(() => {
                    phoneValid = false;
                    setMessage(phoneInput, phoneMessage, "error", "Impossibile verificare il telefono.");
                    disableNextFieldsAfterPhone();

                    setTimeout(() => {
                        phoneInput.focus();
                    }, 50);
                });
        }

        emailInput.addEventListener("input", function () {
            clearTimeout(emailTimer);

            emailValid = false;
            disablePhoneAndNextFields();

            emailTimer = setTimeout(() => {
                checkEmail(false);
            }, 600);
        });

        phoneInput.addEventListener("input", function () {
            clearTimeout(phoneTimer);

            phoneValid = false;
            disableNextFieldsAfterPhone();

            phoneTimer = setTimeout(() => {
                checkPhone(false);
            }, 600);
        });

        emailInput.addEventListener("keydown", function (event) {
            if (event.key === "Tab" || event.key === "Enter") {
                event.preventDefault();
                checkEmail(true);
            }
        });

        phoneInput.addEventListener("keydown", function (event) {
            if (event.key === "Tab" || event.key === "Enter") {
                event.preventDefault();
                checkPhone(true);
            }
        });

        emailInput.addEventListener("blur", function () {
            if (emailInput.value.trim().length > 0 && !emailValid) {
                checkEmail(false);
            }
        });

        phoneInput.addEventListener("blur", function () {
            if (phoneInput.value.trim().length > 0 && !phoneValid) {
                checkPhone(false);
            }
        });

        form.addEventListener("submit", function (event) {
            if (!emailValid) {
                event.preventDefault();
                setMessage(emailInput, emailMessage, "error", "Verifica prima l'email.");
                emailInput.focus();
                return;
            }

            if (!phoneValid) {
                event.preventDefault();
                setMessage(phoneInput, phoneMessage, "error", "Verifica prima il telefono.");
                phoneInput.focus();
            }
        });
    });
</script>

</body>
</html>
