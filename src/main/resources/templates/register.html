<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Register')}"></head>

<style>
    main.auth-page {
        padding: clamp(1rem, 4vw, 2.5rem) clamp(0.75rem, 3vw, 1.25rem) 2.5rem;
    }

    .auth-page .auth-card-page {
        max-width: 720px;
        overflow: hidden;
        background: #fff;
        color: #302a2e;
        border: 1px solid #e8dee3;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    .auth-page .modal-header {
        padding: 1rem clamp(1rem, 4vw, 1.5rem);
        border-bottom: 1px solid #e8dee3;
        background: linear-gradient(180deg, #fff, #fcf9fa);
    }

    .auth-page .modal-header h3 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0;
        color: var(--color3);
        font-size: clamp(1.35rem, 3vw, 1.65rem);
        font-weight: 700;
    }

    .auth-page .modal-body {
        padding: clamp(1rem, 4vw, 1.5rem);
    }

    .auth-page .auth-form-grid {
        gap: 0.8rem 1rem;
    }

    .auth-page .auth-field {
        min-width: 0;
    }

    .auth-page .auth-field label {
        font-size: 0.9rem;
    }

    .auth-page .auth-input {
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 0.55rem 0.75rem;
        border: 1px solid #95868f;
        border-radius: 10px;
        background: #fbfafb;
        color: #302a2e;
        font-size: 1rem;
    }

    .auth-page .auth-input:disabled {
        border-color: #a59aa1;
        background: #f1edf0;
        color: #655961;
        opacity: 1;
        cursor: not-allowed;
    }

    .auth-page .auth-input::file-selector-button {
        margin-right: 0.5rem;
        padding: 0.2rem 0.5rem;
        border: 1px solid #a59aa1;
        border-radius: 5px;
        background: #f5edf1;
        color: inherit;
    }

    .auth-page :is(.auth-input, .auth-btn, .auth-link):focus-visible {
        outline: 2px solid var(--color3);
        outline-offset: 2px;
    }

    .auth-page .auth-alert {
        margin-bottom: 0.85rem;
        padding: 0.6rem 0.8rem;
        border: 1px solid #e8bdc5;
        border-radius: 10px;
        background: #fff1f3;
        color: #a1263b;
        font-size: 0.9rem;
    }

    .auth-page .auth-alert.ok {
        border-color: #a8d1bf;
        background: #eef8f3;
        color: #146345;
    }

    .auth-page .auth-check-message {
        min-height: 1.25em;
        font-size: 0.85rem;
        line-height: 1.25;
    }

    .auth-page .auth-check-message.ok {
        color: #146345;
    }

    .auth-page .auth-check-message.error {
        color: #a1263b;
    }

    .auth-page .auth-input.input-ok {
        border-color: #146345;
    }

    .auth-page .auth-input.input-error {
        border-color: #a1263b;
    }

    .auth-page .auth-section-title {
        margin: 0;
        padding-top: 0.75rem;
        border-top: 1px solid #e8dee3;
    }

    .auth-page .auth-btn {
        width: 100%;
        min-height: 44px;
        padding: 0.55rem 0.9rem;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--color1), #8c3e59);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }

    .auth-page .auth-btn:enabled:hover {
        background: #8c3e59;
    }

    .auth-page .auth-btn:disabled {
        background: #e8dfe4;
        color: #62515b;
        opacity: 1;
        cursor: not-allowed;
    }

    .auth-page .auth-note {
        margin: 1rem 0 0;
        text-align: center;
    }

    .auth-page .auth-link {
        color: #7f354f;
        font-size: inherit;
        text-decoration: underline;
    }
</style>

<body class="shop-page">

<div th:replace="~{fragments/nav :: nav}"></div>

<main class="auth-page">
    <div class="auth-card auth-card-page">

        <div class="modal-header">
            <h3>
                <i class="bi bi-person-plus"></i>
                Crea il tuo account
            </h3>
        </div>

        <div class="modal-body">

            <div class="auth-alert"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <div class="auth-alert ok"
                 th:if="${param.registered}">
                Registrazione completata. Ora puoi accedere.
            </div>

            <form th:action="@{/register}"
                  method="post"
                  enctype="multipart/form-data"
                  class="auth-form-grid"
                  id="registerForm">

                <div class="auth-field">
                    <label for="email">Email *</label>
                    <input class="auth-input"
                           type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           required>
                    <div id="emailCheckMessage" class="auth-check-message"></div>
                </div>

                <div class="auth-field">
                    <label for="phone">Telefono *</label>
                    <input class="auth-input"
                           type="tel"
                           id="phone"
                           name="phone"
                           autocomplete="tel"
                           required
                           disabled>
                    <div id="phoneCheckMessage" class="auth-check-message"></div>
                </div>

                <div class="auth-field">
                    <label for="password">Password *</label>
                    <input class="auth-input lock-after-phone"
                           type="password"
                           id="password"
                           name="password"
                           autocomplete="new-password"
                           required
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="confirmPassword">Conferma password *</label>
                    <input class="auth-input lock-after-phone"
                           type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           autocomplete="new-password"
                           required
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="firstname">Nome</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="firstname"
                           name="firstname"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="lastname">Cognome</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="lastname"
                           name="lastname"
                           disabled>
                </div>

                <div class="auth-field auth-span-2">
                    <label for="avatarFile">Avatar</label>
                    <input class="auth-input lock-after-phone"
                           type="file"
                           id="avatarFile"
                           name="avatarFile"
                           accept="image/*"
                           disabled>
                    <div class="auth-hint">
                        JPG / PNG – opzionale
                    </div>
                </div>

                <div class="auth-section-title">
                    <i class="bi bi-geo-alt"></i>
                    Indirizzo
                </div>

                <div class="auth-field">
                    <label for="street">Via</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="street"
                           name="street"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="city">Città</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="city"
                           name="city"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="zipcode">CAP</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="zipcode"
                           name="zipcode"
                           disabled>
                </div>

                <div class="auth-field">
                    <label for="province">Provincia</label>
                    <input class="auth-input lock-after-phone"
                           type="text"
                           id="province"
                           name="province"
                           disabled>
                </div>

                <div class="auth-span-2">
                    <button type="submit" class="auth-btn" id="registerSubmit" disabled>
                        Registrati
                    </button>
                </div>

            </form>

            <div class="auth-note">
                Hai già un account?
                <a th:href="@{/login}" class="auth-link">Accedi</a>
            </div>

        </div>
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const emailInput = document.getElementById("email");
        const phoneInput = document.getElementById("phone");
        const emailMessage = document.getElementById("emailCheckMessage");
        const phoneMessage = document.getElementById("phoneCheckMessage");
        const submitButton = document.getElementById("registerSubmit");
        const fieldsAfterPhone = document.querySelectorAll(".lock-after-phone");
        const form = document.getElementById("registerForm");

        let emailValid = false;
        let phoneValid = false;
        let emailTimer = null;
        let phoneTimer = null;

        function setMessage(input, messageBox, type, message) {
            messageBox.textContent = message || "";
            messageBox.classList.remove("ok", "error");
            input.classList.remove("input-ok", "input-error");

            if (type === "ok") {
                messageBox.classList.add("ok");
                input.classList.add("input-ok");
            }

            if (type === "error") {
                messageBox.classList.add("error");
                input.classList.add("input-error");
            }
        }

        function disablePhoneAndNextFields() {
            phoneValid = false;
            phoneInput.disabled = true;
            phoneInput.value = "";
            setMessage(phoneInput, phoneMessage, "", "");

            fieldsAfterPhone.forEach(field => {
                field.disabled = true;
                if (field.type !== "file") {
                    field.value = "";
                }
            });

            submitButton.disabled = true;
        }

        function enablePhoneField() {
            phoneInput.disabled = false;
        }

        function disableNextFieldsAfterPhone() {
            phoneValid = false;

            fieldsAfterPhone.forEach(field => {
                field.disabled = true;
                if (field.type !== "file") {
                    field.value = "";
                }
            });

            submitButton.disabled = true;
        }

        function enableNextFieldsAfterPhone() {
            fieldsAfterPhone.forEach(field => {
                field.disabled = false;
            });

            submitButton.disabled = false;
        }

        function checkEmail(moveNext) {
            const email = emailInput.value.trim();

            emailValid = false;
            disablePhoneAndNextFields();

            if (email.length < 5 || !email.includes("@")) {
                setMessage(emailInput, emailMessage, "", "");
                return;
            }

            fetch("/register/check-email?email=" + encodeURIComponent(email))
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        emailValid = false;
                        setMessage(emailInput, emailMessage, "error", data.message || "Email già registrata.");
                        disablePhoneAndNextFields();

                        setTimeout(() => {
                            emailInput.focus();
                            emailInput.select();
                        }, 50);

                        return;
                    }

                    emailValid = true;
                    setMessage(emailInput, emailMessage, "ok", data.message || "Email disponibile.");
                    enablePhoneField();

                    if (moveNext) {
                        setTimeout(() => {
                            phoneInput.focus();
                        }, 50);
                    }
                })
                .catch(() => {
                    emailValid = false;
                    setMessage(emailInput, emailMessage, "error", "Impossibile verificare l'email.");
                    disablePhoneAndNextFields();

                    setTimeout(() => {
                        emailInput.focus();
                    }, 50);
                });
        }

        function checkPhone(moveNext) {
            const phone = phoneInput.value.trim();

            phoneValid = false;
            disableNextFieldsAfterPhone();

            if (!emailValid) {
                setTimeout(() => {
                    emailInput.focus();
                }, 50);
                return;
            }

            if (phone.length < 5) {
                setMessage(phoneInput, phoneMessage, "", "");
                return;
            }

            fetch("/register/check-phone?phone=" + encodeURIComponent(phone))
                .then(response => response.json())
                .then(data => {
                    if (data.exists) {
                        phoneValid = false;
                        setMessage(phoneInput, phoneMessage, "error", data.message || "Telefono già registrato.");
                        disableNextFieldsAfterPhone();

                        setTimeout(() => {
                            phoneInput.focus();
                            phoneInput.select();
                        }, 50);

                        return;
                    }

                    phoneValid = true;
                    setMessage(phoneInput, phoneMessage, "ok", data.message || "Telefono disponibile.");
                    enableNextFieldsAfterPhone();

                    if (moveNext) {
                        setTimeout(() => {
                            document.getElementById("password").focus();
                        }, 50);
                    }
                })
                .catch(() => {
                    phoneValid = false;
                    setMessage(phoneInput, phoneMessage, "error", "Impossibile verificare il telefono.");
                    disableNextFieldsAfterPhone();

                    setTimeout(() => {
                        phoneInput.focus();
                    }, 50);
                });
        }

        emailInput.addEventListener("input", function () {
            clearTimeout(emailTimer);

            emailValid = false;
            disablePhoneAndNextFields();

            emailTimer = setTimeout(() => {
                checkEmail(false);
            }, 600);
        });

        phoneInput.addEventListener("input", function () {
            clearTimeout(phoneTimer);

            phoneValid = false;
            disableNextFieldsAfterPhone();

            phoneTimer = setTimeout(() => {
                checkPhone(false);
            }, 600);
        });

        emailInput.addEventListener("keydown", function (event) {
            if (event.key === "Tab" || event.key === "Enter") {
                event.preventDefault();
                checkEmail(true);
            }
        });

        phoneInput.addEventListener("keydown", function (event) {
            if (event.key === "Tab" || event.key === "Enter") {
                event.preventDefault();
                checkPhone(true);
            }
        });

        emailInput.addEventListener("blur", function () {
            if (emailInput.value.trim().length > 0 && !emailValid) {
                checkEmail(false);
            }
        });

        phoneInput.addEventListener("blur", function () {
            if (phoneInput.value.trim().length > 0 && !phoneValid) {
                checkPhone(false);
            }
        });

        form.addEventListener("submit", function (event) {
            if (!emailValid) {
                event.preventDefault();
                setMessage(emailInput, emailMessage, "error", "Verifica prima l'email.");
                emailInput.focus();
                return;
            }

            if (!phoneValid) {
                event.preventDefault();
                setMessage(phoneInput, phoneMessage, "error", "Verifica prima il telefono.");
                phoneInput.focus();
            }
        });
    });
</script>

</body>
</html>
