<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>

    <!-- CSS globale -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<!-- NAV -->
<div th:replace="fragments/nav :: nav"></div>

<main class="auth-page">
    <div class="auth-card auth-card-page">

        <!-- HEADER -->
        <div class="modal-header">
            <h3>
                <i class="bi bi-person-plus"></i>
                Crea il tuo account
            </h3>
        </div>

        <div class="modal-body">

            <!-- ERROR -->
            <div class="auth-alert"
                 th:if="${errorMessage}"
                 th:text="${errorMessage}">
            </div>

            <!-- SUCCESS -->
            <div class="auth-alert ok"
                 th:if="${param.registered}">
                Registrazione completata. Ora puoi accedere.
            </div>

            <!-- FORM -->
            <form th:action="@{/register}"
                  method="post"
                  enctype="multipart/form-data"
                  class="auth-form-grid">

                <!-- EMAIL -->
                <div class="auth-field">
                    <label>Email *</label>
                    <input class="auth-input"
                           type="email"
                           name="email"
                           required>
                </div>

                <!-- TELEFONO -->
                <div class="auth-field">
                    <label>Telefono</label>
                    <input class="auth-input"
                           type="text"
                           name="phone">
                </div>

                <!-- PASSWORD -->
                <div class="auth-field">
                    <label>Password *</label>
                    <input class="auth-input"
                           type="password"
                           name="password"
                           required>
                </div>

                <!-- CONFERMA PASSWORD -->
                <div class="auth-field">
                    <label>Conferma password *</label>
                    <input class="auth-input"
                           type="password"
                           name="confirmPassword"
                           required>
                </div>

                <!-- NOME -->
                <div class="auth-field">
                    <label>Nome</label>
                    <input class="auth-input"
                           type="text"
                           name="firstname">
                </div>

                <!-- COGNOME -->
                <div class="auth-field">
                    <label>Cognome</label>
                    <input class="auth-input"
                           type="text"
                           name="lastname">
                </div>

                <!-- AVATAR -->
                <div class="auth-field auth-span-2">
                    <label>Avatar</label>
                    <input class="auth-input"
                           type="file"
                           name="avatarFile"
                           accept="image/*">
                    <div class="auth-hint">
                        JPG / PNG – opzionale
                    </div>
                </div>

                <!-- INDIRIZZO -->
                <div class="auth-section-title">
                    <i class="bi bi-geo-alt"></i>
                    Indirizzo
                </div>

                <div class="auth-field">
                    <label>Via</label>
                    <input class="auth-input"
                           type="text"
                           name="street">
                </div>

                <div class="auth-field">
                    <label>Città</label>
                    <input class="auth-input"
                           type="text"
                           name="city">
                </div>

                <div class="auth-field">
                    <label>CAP</label>
                    <input class="auth-input"
                           type="text"
                           name="zipcode">
                </div>

                <div class="auth-field">
                    <label>Provincia</label>
                    <input class="auth-input"
                           type="text"
                           name="province">
                </div>

                <!-- SUBMIT -->
                <div class="auth-span-2">
                    <button type="submit" class="auth-btn">
                        Registrati
                    </button>
                </div>

            </form>

            <div class="auth-note">
                Hai già un account?
                <a th:href="@{/login}" class="auth-link">Accedi</a>
            </div>

        </div>
    </div>
</main>

</body>
</html>
