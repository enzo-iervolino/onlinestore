<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accesso non riuscito | Online Store</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-6">
            <section class="card shadow-sm" aria-labelledby="login-error-title">
                <div class="card-body p-4 p-sm-5">
                    <p class="small text-secondary mb-2">Online Store</p>
                    <h1 id="login-error-title" class="h4 mb-3">Accesso non riuscito</h1>
                    <p class="alert alert-danger" role="alert">
                        L’accesso non è stato completato. Torna al login per riprovare.
                    </p>
                    <div class="d-grid gap-2">
                        <a th:href="@{/login}" class="btn btn-primary">Torna al login</a>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Torna alla home</a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
