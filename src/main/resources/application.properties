spring.application.name=online-store

# ============================================================
# SERVER
# ============================================================
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

# ============================================================
# DATASOURCE (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mystoredb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# Hibernate sceglie automaticamente il dialect PostgreSQL.
# Lasciato opzionale solo per compatibilità.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ============================================================
# MAIL
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
spring.mail.default-encoding=UTF-8

# ============================================================
# STRIPE
# ============================================================
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.webhook-secret=${stripe.webhook.secret}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.secret.key=${stripe.secret-key}

app.payment.success-url=${APP_PAYMENT_SUCCESS_URL:http://localhost:8081/checkout/stripe/success?session_id={CHECKOUT_SESSION_ID}}
app.payment.cancel-url=${APP_PAYMENT_CANCEL_URL:http://localhost:8081/checkout/stripe/cancel}

# ============================================================
# PAYPAL
# ============================================================
paypal.api.url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.return.url=${PAYPAL_RETURN_URL:http://localhost:8081/paypal/success}
paypal.cancel.url=${PAYPAL_CANCEL_URL:http://localhost:8081/checkout?error=paypal_cancel}

# ============================================================
# GOOGLE OAUTH2 LOGIN
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ============================================================
# SECURITY DEFAULT USER
# ============================================================
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:ADMIN}

# ============================================================
# MULTIPART / UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:250MB}
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT:200}

# ============================================================
# PAGINE SHOP
# ============================================================
shop.pages.shop=${SHOP_PAGE:shop/shop}
shop.pages.detail-shop=${SHOP_DETAIL_PAGE:shop/shop-detail}

# ============================================================
# FFMPEG
# ============================================================
app.ffmpeg.path=${FFMPEG_PATH:C:/ffmpeg/bin/ffmpeg.exe}
app.ffmpeg.webm-duration-seconds=${FFMPEG_WEBM_DURATION_SECONDS:10}
app.ffmpeg.webm-fps=${FFMPEG_WEBM_FPS:25}
app.ffmpeg.webm-bitrate=${FFMPEG_WEBM_BITRATE:1M}

# ============================================================
# IMPORT COLORI / TAGLIE
# ============================================================
app.import.colors.enabled=${IMPORT_COLORS_ENABLED:false}
app.import.colors.path=${IMPORT_COLORS_PATH:import/colors.csv}
app.import.sizes.enabled=${IMPORT_SIZES_ENABLED:false}
app.import.sizes.path=${IMPORT_SIZES_PATH:import/sizes.csv}

# ============================================================
# LOGGING BASE
# ============================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.com.delta=${LOGGING_LEVEL_APP:DEBUG}