spring.application.name=online-store

# ============================================================
# SERVER
# ============================================================
server.port=${PORT:${SERVER_PORT:8081}}
server.forward-headers-strategy=framework

# ============================================================
# BASE URL PUBBLICO APPLICAZIONE
# In locale resta localhost.
# Online imposta APP_BASE_URL con il dominio pubblico reale.
#
# Esempio locale:
# APP_BASE_URL=http://localhost:8081
#
# Esempio Codespaces porta 8081:
# APP_BASE_URL=https://curly-robot-5ggp6jgw97j9f4gx6-8081.app.github.dev
#
# Esempio Render/Railway/VPS:
# APP_BASE_URL=https://tuo-dominio-online
# ============================================================
app.base-url=${APP_BASE_URL:http://localhost:8081}

# ============================================================
# CONFIGURAZIONI AMMINISTRATIVE ESTERNE
# I file vengono creati automaticamente dai modelli predefiniti
# presenti in src/main/resources/default-config.
# ============================================================
app.admin.menu.file=${ADMIN_MENU_FILE:config/menu/admin-menu.json}
app.site.notice.file=${SITE_NOTICE_FILE:config/site/site-notice.json}

# ============================================================
# DATASOURCE PostgreSQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mystoredb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# Hibernate sceglie automaticamente il dialect PostgreSQL.
# Lasciato opzionale solo per compatibilità.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ============================================================
# MAIL
# Locale: valori generici/Gmail come fallback.
# Produzione: usa SPRING_PROFILES_ACTIVE=prod e application-prod.properties
# per Brevo SMTP. Non inserire credenziali reali nel repository.
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Online Store}
# Modalità invio email:
# - smtp: usa JavaMailSender (locale/Gmail/SMTP)
# - brevo-api: usa Brevo API HTTPS, consigliato in produzione Railway
app.mail.delivery-mode=${MAIL_DELIVERY_MODE:smtp}
brevo.api.enabled=${BREVO_API_ENABLED:false}
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}


# ============================================================
# STRIPE
# IMPORTANTE:
# Non mettere chiavi reali nel file.
# Inseriscile come variabili ambiente.
# ============================================================
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.webhook-secret=${stripe.webhook.secret}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.secret.key=${stripe.secret-key}

# La success Stripe deve sempre passare dal controller Stripe, non da /checkout/success.
# Se APP_PAYMENT_SUCCESS_URL in produzione è errata, il codice la corregge automaticamente.
app.payment.success-url=${APP_PAYMENT_SUCCESS_URL:${app.base-url}/checkout/stripe/success?session_id={CHECKOUT_SESSION_ID}}
app.payment.cancel-url=${APP_PAYMENT_CANCEL_URL:${app.base-url}/checkout/stripe/cancel}

# ============================================================
# PAYPAL
# IMPORTANTE:
# Non mettere client id e secret reali nel file.
# Inseriscili come variabili ambiente.
#
# Sandbox:
# PAYPAL_API_URL=https://api-m.sandbox.paypal.com
#
# Live:
# PAYPAL_API_URL=https://api-m.paypal.com
# ============================================================
paypal.api.url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.currency=${PAYPAL_CURRENCY:EUR}

# La return PayPal deve sempre passare dal controller PayPal, non da /checkout/success.
# Se PAYPAL_RETURN_URL in produzione è errata, il codice la corregge automaticamente.
paypal.return.url=${PAYPAL_RETURN_URL:${app.base-url}/paypal/success}
paypal.cancel.url=${PAYPAL_CANCEL_URL:${app.base-url}/paypal/cancel}

# ============================================================
# GOOGLE OAUTH2 LOGIN
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ============================================================
# FACEBOOK OAUTH2 LOGIN
# Crea l'app su Meta for Developers e configura come redirect OAuth valido:
# http://localhost:8081/login/oauth2/code/facebook
# In produzione usa: https://tuo-dominio/login/oauth2/code/facebook
# Non inserire credenziali reali nel repository.
# ============================================================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/${FACEBOOK_GRAPH_API_VERSION:v25.0}/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/${FACEBOOK_GRAPH_API_VERSION:v25.0}/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/${FACEBOOK_GRAPH_API_VERSION:v25.0}/me?fields=id,name,first_name,last_name,email,picture.type(large)
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ============================================================
# SECURITY DEFAULT USER
# ============================================================
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}
spring.security.user.roles=${SPRING_SECURITY_USER_ROLES:ADMIN}

# ============================================================
# MULTIPART / UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:250MB}
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT:200}

# ============================================================
# PAGINE SHOP
# ============================================================
shop.pages.shop=${SHOP_PAGE:shop/shop}
shop.pages.detail-shop=${SHOP_DETAIL_PAGE:shop/shop-detail}

# ============================================================
# FFMPEG
# ============================================================
app.ffmpeg.path=${FFMPEG_PATH:C:/ffmpeg/bin/ffmpeg.exe}
app.ffmpeg.webm-duration-seconds=${FFMPEG_WEBM_DURATION_SECONDS:10}
app.ffmpeg.webm-fps=${FFMPEG_WEBM_FPS:25}
app.ffmpeg.webm-bitrate=${FFMPEG_WEBM_BITRATE:1M}

# ============================================================
# IMPORT COLORI / TAGLIE
# ============================================================
app.import.colors.enabled=${IMPORT_COLORS_ENABLED:false}
app.import.colors.path=${IMPORT_COLORS_PATH:import/colors.csv}
app.import.sizes.enabled=${IMPORT_SIZES_ENABLED:false}
app.import.sizes.path=${IMPORT_SIZES_PATH:import/sizes.csv}

# ============================================================
# LOGGING BASE
# ============================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.com.delta=${LOGGING_LEVEL_APP:DEBUG}

# Log specifici utili per capire PayPal online
logging.level.com.delta.store.web.payment.service.PayPalApiService=${LOGGING_LEVEL_PAYPAL:DEBUG}
logging.level.com.delta.store.web.payment.processor.PayPalPaymentProcessor=${LOGGING_LEVEL_PAYPAL_PROCESSOR:DEBUG}