


    





<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista Prodotti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	
	
	 

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    color: #222;
    padding: 30px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}

h1 {
    margin-bottom: 20px;
    text-align: center;
}

.actions {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

button {
    background: #007bff;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #0056b3;
}

.message {
    text-align: center;
    margin-bottom: 20px;
    font-weight: bold;
}

.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

.product-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s ease;
}

.product-card:hover {
    transform: translateY(-4px);
}

.product-card h3 {
    margin-bottom: 10px;
    color: #007bff;
}

.product-card p {
    margin-bottom: 8px;
    font-size: 14px;
}

.empty {
    text-align: center;
    grid-column: 1 / -1;
    color: #666;
    font-size: 18px;
}


</style>


</head>
<body>
    <div class="container">
        <h1>Prodotti</h1>

        <div class="actions">
            <button id="loadProductsBtn">Carica prodotti</button>
        </div>

        <div id="message" class="message"></div>

        <div id="productsContainer" class="products-grid"></div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
const loadProductsBtn = document.getElementById("loadProductsBtn");
const productsContainer = document.getElementById("productsContainer");
const message = document.getElementById("message");

loadProductsBtn.addEventListener("click", loadProducts);

async function loadProducts() {
    message.textContent = "Caricamento prodotti...";
    productsContainer.innerHTML = "";

    try {
        const response = await fetch("http://localhost:8081/api/products");

        if (!response.ok) {
            throw new Error("Errore HTTP: " + response.status);
        }

        const products = await response.json();
        console.log("Prodotti ricevuti:", products);

        message.textContent = "";

        if (!products || products.length === 0) {
            productsContainer.innerHTML = `<div class="empty">Nessun prodotto trovato</div>`;
            return;
        }

        products.forEach(product => {
            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <h3>${product.name ?? "Nome non disponibile"}</h3>
                <p><strong>ID:</strong> ${product.id ?? "-"}</p>
                <p><strong>Descrizione:</strong> ${product.description ?? "-"}</p>
                <p><strong>Prezzo:</strong> ${product.price ?? "-"}</p>
                <p><strong>Categoria:</strong> ${product.categoryName ?? "-"}</p>
            `;

            productsContainer.appendChild(card);
        });

    } catch (error) {
        console.error("Errore fetch prodotti:", error);
        message.textContent = "Errore durante il caricamento dei prodotti";
    }
}
</script>

</body>
</html>
