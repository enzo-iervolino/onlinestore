<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista Prodotti</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .table-small {
            table-layout: fixed;
            width: 100%;
            font-size: 11px;
        }

        .table-small th,
        .table-small td {
            padding: 0.15rem 0.3rem;
            vertical-align: middle;
        }

        .cell-limit {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1 {
            font-size: 1.4rem;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container mt-3">
    <h1>Lista Prodotti</h1>

    <div class="mb-2 d-flex gap-2">
        <button type="button"
                class="btn btn-success btn-sm"
                onclick="exportJson()">
            Esporta JSON
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-sm table-small align-middle">
            <thead class="table-light">
                <tr>
                    <th scope="col" style="width: 50px;">#</th>
                    <th scope="col" style="width: 220px;">Uuid</th>
                    <th scope="col" style="width: 100px;">Codice</th>
                    <th scope="col" style="width: 180px;">Nome</th>
                    <th scope="col" style="width: 140px;">Categoria</th>
                    <th scope="col" style="width: 80px;">Prezzo</th>
                    <th scope="col" style="width: 70px;">Stock</th>
                    <th>
                        <button type="button"
                                class="btn btn-primary btn-sm"
                                data-bs-toggle="modal"
                                data-bs-target="#insertModal">+</button>
                    </th>
                </tr>
            </thead>
            <tbody id="table-body-custom">
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="insertModal" tabindex="-1" aria-labelledby="insertModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="insertModalLabel">Inserimento nuovo Prodotto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <form id="productForm">
                    <div class="mb-3">
                        <input type="text"
                               class="form-control form-control-sm"
                               id="codpro"
                               name="codpro"
                               placeholder="Codice prodotto"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="text"
                               class="form-control form-control-sm"
                               id="name"
                               name="name"
                               placeholder="Nome prodotto"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="number"
                               class="form-control form-control-sm"
                               id="categoryId"
                               name="categoryId"
                               placeholder="Category ID"
                               min="1"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="number"
                               class="form-control form-control-sm"
                               id="stockQty"
                               name="stockQty"
                               placeholder="Quantità stock"
                               min="1"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="number"
                               class="form-control form-control-sm"
                               id="price"
                               name="price"
                               placeholder="Prezzo"
                               min="0.01"
                               step="0.01"
                               required>
                    </div>
                </form>

                <div id="messageBox" class="small mt-2"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Chiudi</button>
                <button type="submit" form="productForm" class="btn btn-primary btn-sm">Salva</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
async function loadProducts() {
    try {
        const response = await fetch("http://localhost:8081/api/products");
        const body = await response.json();

        const tableBody = document.getElementById("table-body-custom");
        tableBody.innerHTML = "";

        for (const item of body) {
            tableBody.innerHTML += `
                <tr>
                    <td>${item.id ?? ""}</td>
                    <td class="cell-limit" title="${item.publicId ?? ""}">${item.publicId ?? ""}</td>
                    <td class="cell-limit" title="${item.codpro ?? ""}">${item.codpro ?? ""}</td>
                    <td class="cell-limit" title="${item.name ?? ""}">${item.name ?? ""}</td>
                    <td class="cell-limit" title="${item.categoryName ?? ""}">${item.categoryName ?? ""}</td>
                    <td>${item.price ?? ""}</td>
                    <td>${item.stockQty ?? ""}</td>
                    <td></td>
                </tr>
            `;
        }
    } catch (error) {
        console.error("Errore durante il caricamento prodotti:", error);
    }
}

async function exportJson() {
    try {
        const response = await fetch("http://localhost:8081/api/products");

        if (!response.ok) {
            throw new Error("Errore durante il recupero prodotti");
        }

        const products = await response.json();
        const jsonString = JSON.stringify(products, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "products.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

    } catch (error) {
        console.error("Errore durante esportazione JSON:", error);
        alert("Errore durante esportazione JSON");
    }
}

loadProducts();
</script>

<script>
document.getElementById("productForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const messageBox = document.getElementById("messageBox");
    messageBox.innerHTML = "";

    const product = {
        codpro: document.getElementById("codpro").value.trim(),
        name: document.getElementById("name").value.trim(),
        categoryId: parseInt(document.getElementById("categoryId").value),
        stockQty: parseInt(document.getElementById("stockQty").value),
        price: parseFloat(document.getElementById("price").value)
    };

    try {
        const response = await fetch("http://localhost:8081/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(product)
        });

        if (!response.ok) {
            throw new Error("Errore durante il salvataggio del prodotto");
        }

        messageBox.innerHTML = `<span class="text-success">Prodotto salvato correttamente</span>`;

        document.getElementById("productForm").reset();

        const modalElement = document.getElementById("insertModal");
        const modalInstance = bootstrap.Modal.getInstance(modalElement);
        modalInstance.hide();

        loadProducts();
    } catch (error) {
        console.error(error);
        messageBox.innerHTML = `<span class="text-danger">Errore nel salvataggio del prodotto</span>`;
    }
});
</script>

</body>
</html>
