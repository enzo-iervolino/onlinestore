<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Online Store Gift Card Luxury</title>
  <desc id="desc">Immagine elegante di una gift card online in stile lussuoso oro e champagne.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="55%" stop-color="#f1ddbb"/>
      <stop offset="100%" stop-color="#e0bc77"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#b88222" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#f6df9c" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#9f7324" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="70" y="55" width="760" height="410" rx="34" fill="url(#cardBg)" filter="url(#softShadow)"/>
  <rect x="83" y="68" width="734" height="384" rx="28" fill="none" stroke="#c89738" stroke-opacity="0.55" stroke-width="2.2"/>

  <path d="M70 140c108-46 203-49 301-12 94 35 182 40 280 13 65-18 122-49 179-86v-1c0 0 0 0 0 0v148c-70 54-138 88-232 98-111 12-210-10-308-49-93-37-171-42-220-38V140z" fill="url(#ribbon)" opacity="0.95"/>
