  <text x="450" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="6" fill="#fff7e4">LUXURY GIFT CARD</text>

  <text x="120" y="360" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#9a6b16">GIFT CARD PREMIUM</text>
