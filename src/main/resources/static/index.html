<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova di integrazione</title>

    <link rel="stylesheet" href="assets/lib/bootstrap/css/bootstrap.css" />
    <link rel="stylesheet" href="assets/lib/bootstrap-table/bootstrap-table.min.css" />

    <style>
        body {
            font-size: 12px;
            background-color: #f8f9fa;
        }

        .container-box {
            max-width: 980px;
            margin: 25px auto;
            background: #fff;
            padding: 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 14px;
            text-align: center;
        }

        .table-small {
            table-layout: fixed;
            width: 100%;
            font-size: 12px;
        }

        .table-small th,
        .table-small td {
            padding: 0.12rem 0.25rem;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
			font-size: 12px;
			}

        .table-small thead th {
            background-color: #f1f3f5;
            font-size: 12px;
            font-weight: 600;
        }

        .bootstrap-table .fixed-table-toolbar {
            margin-bottom: 8px;
        }

        .bootstrap-table .fixed-table-toolbar .search input {
            height: 28px;
            font-size: 11px;
            padding: 0.20rem 0.45rem;
        }

        .bootstrap-table .fixed-table-toolbar .btn {
            font-size: 11px;
            padding: 0.20rem 0.45rem;
        }

        .fixed-table-pagination {
            font-size: 11px;
        }

        .page-link {
            padding: 0.20rem 0.45rem;
            font-size: 11px;
        }

        .btn {
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <h1>Prova di integrazione</h1>

        <table
            class="table table-striped table-bordered table-sm table-small"
            data-toggle="table"
            data-url="assets/file.json"
            data-search="true"
            data-sortable="true"
			data-show-export="true"
            data-pagination="true"
            data-page-size="10"
            data-page-list="[5, 10, 20, 50, All]"
            data-export-options='{"fileName": "Products"}'>
            <thead>
                <tr>
                    <th data-field="id" data-sortable="true" data-width="50" data-align="center" data-halign="center">#</th>
                    <th data-field="publicId" data-width="200" data-halign="center">Uuid</th>
                    <th data-field="codpro" data-width="90" data-sortable="true" data-halign="center">Codice</th>
                    <th data-field="name" data-width="160" data-sortable="true" data-halign="center">Nome</th>
                    <th data-field="price"
                        data-width="90"
						data-align="center"
						data-halign="center"
						data-sortable="true"
						data-formatter="priceFormatter">Prezzo</th>
                </tr>
            </thead>
        </table>
    </div>

    <script src="assets/lib/jquery/jquery-3.6.0.min.js"></script>
    <script src="assets/lib/bootstrap/js/bootstrap.bundle.js"></script>
    <script src="assets/lib/bootstrap-table/bootstrap-table.min.js"></script>
    <script src="assets/lib/table-export/tableExport.min.js"></script>
    <script src="assets/lib/bootstrap-table/extensions/export/bootstrap-table-export.min.js"></script>

    <script>
        function priceFormatter(value) {
            if (value === null || value === undefined || value === "") {
                return "";
            }

            const number = parseFloat(value);

            if (isNaN(number)) {
                return value;
            }

            return number.toLocaleString("it-IT", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " €";
        }
    </script>

</body>
</html>
