# ============================================================
# PROFILO PRODUZIONE - RAILWAY / BREVO / STRIPE / PAYPAL
# Attiva con: SPRING_PROFILES_ACTIVE=prod
# Non inserire credenziali reali nel repository: usa variabili ambiente Railway.
# ============================================================

# Base URL pubblico reale dell'app, senza slash finale.
# Esempio Railway: https://onlinestore-production-ec69.up.railway.app
app.base-url=${APP_BASE_URL:http://localhost:8081}
server.forward-headers-strategy=framework

# ============================================================
# DATABASE PRODUZIONE - RAILWAY POSTGRES
# Railway può esporre sia SPRING_DATASOURCE_* sia PG*.
# Manteniamo anche DB_* per compatibilità con le vecchie configurazioni.
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/mystoredb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# ============================================================
# MAIL PRODUZIONE - BREVO SMTP
# Usa SMTP Login + SMTP Key, NON la API Key REST di Brevo.
# Il bean MailConfig ripulisce virgolette e ritorni a capo se Railway li conserva nel valore.
# ============================================================
app.mail.from=${MAIL_FROM:${BREVO_FROM:}}
app.mail.from-name=${MAIL_FROM_NAME:Online Store}

spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_LOGIN:${MAIL_USERNAME:}}
spring.mail.password=${BREVO_SMTP_KEY:${MAIL_PASSWORD:}}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}
spring.mail.properties.mail.smtp.ssl.trust=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# ============================================================
# STRIPE PRODUZIONE/SANDBOX
# Non usare /checkout/success come ritorno Stripe: quello mostra solo ordini già creati.
# Il ritorno corretto deve passare da /checkout/stripe/success con session_id.
# ============================================================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.secret.key=${stripe.secret-key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.webhook-secret=${stripe.webhook.secret}
app.payment.success-url=${APP_PAYMENT_SUCCESS_URL:${app.base-url}/checkout/stripe/success?session_id={CHECKOUT_SESSION_ID}}
app.payment.cancel-url=${APP_PAYMENT_CANCEL_URL:${app.base-url}/checkout/stripe/cancel}

# ============================================================
# PAYPAL PRODUZIONE/SANDBOX
# PAYPAL_MODE=sandbox usa https://api-m.sandbox.paypal.com
# PAYPAL_MODE=live usa https://api-m.paypal.com, salvo PAYPAL_API_URL esplicita.
# Non usare /checkout/success come return PayPal: prima serve capture COMPLETED.
# ============================================================
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.api.url=${PAYPAL_API_URL:}
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.currency=${PAYPAL_CURRENCY:EUR}
paypal.return.url=${PAYPAL_RETURN_URL:${app.base-url}/paypal/success}
paypal.cancel.url=${PAYPAL_CANCEL_URL:${app.base-url}/paypal/cancel}

# ============================================================
# GOOGLE LOGIN PRODUZIONE
# Accetta sia GOOGLE_* sia nomi Spring Boot completi da Railway.
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}

# ============================================================
# UPLOAD PRODUZIONE
# ============================================================
app.upload.dir=${UPLOAD_DIR:/app/uploads}

# ============================================================
# LOG UTILI PER RAILWAY
# ============================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.com.delta=${LOGGING_LEVEL_APP:INFO}
logging.level.com.delta.store.web.payment=${LOGGING_LEVEL_PAYMENT:DEBUG}
logging.level.com.delta.store.web.shop.StripeCheckoutController=${LOGGING_LEVEL_STRIPE_SUCCESS:DEBUG}
logging.level.com.delta.store.web.shop.StripeWebhookController=${LOGGING_LEVEL_STRIPE_WEBHOOK:DEBUG}
logging.level.com.delta.store.web.shop.PayPalCheckoutController=${LOGGING_LEVEL_PAYPAL_SUCCESS:DEBUG}
logging.level.com.delta.store.web.payment.service.CheckoutSnapshotService=${LOGGING_LEVEL_CHECKOUT_SNAPSHOT:DEBUG}
logging.level.com.delta.store.order.service.OrderNotificationService=${LOGGING_LEVEL_ORDER_EMAIL:DEBUG}
